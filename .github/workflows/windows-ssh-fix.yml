name: Windows SSH fix - tests and installer

on:
  push:
    branches: [fix/windows-ssh]
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "0"
  LEFTHOOK: "0"
  EXPO_NO_TELEMETRY: "1"

jobs:
  regression:
    name: SSH regression (Windows, Linux and macOS argument cases)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install test dependencies (no native postinstall)
        run: npm ci --ignore-scripts
      - name: Check Windows and POSIX SSH argument construction
        run: npx vitest run packages/desktop/src/features/remote-ssh/target.test.ts

  sdk:
    name: Build native Windows SDK
    needs: regression
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-06
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: omp-sdk -> target/desktop
      - run: npm ci
      - run: npm run build:omp-sdk
      - run: node scripts/packaging/sdk-artifact.mjs create sdk-artifacts
      - run: node scripts/packaging/smoke-sdk-artifact.mjs sdk-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: OMP-SDK-win32-x64-test
          path: sdk-artifacts/*
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Package Windows x64 installer
    needs: sdk
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: OMP-SDK-win32-x64-test
          path: sdk-artifacts
      - name: Package unsigned Windows installer from tested SDK
        run: npm run build:windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MINI_ELECTRON_RUNTIME_VERSION: "0.1.37"
          OMP_DESKTOP_SDK_ARTIFACT: ${{ github.workspace }}/sdk-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: OMP-Desktop-Windows-SSH-Fix-x64
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.zip
          if-no-files-found: error
          retention-days: 14
